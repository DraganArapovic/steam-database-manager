services:
  postgres:
    image: postgres:16-alpine
    container_name: steam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: steamdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres.sql:/docker-entrypoint-initdb.d/01-steam.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d steamdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
